  image:
    repository: ghcr.io/home-operations/transmission
    tag: rolling
    pullPolicy: IfNotPresent

  service:
    rpc:
      type: ClusterIP
      port: 9091
      nodePort:
    peer:
      type: LoadBalancer
      port: 11413
      nodePort:
      nodePortUDP:

  ingress:
    enabled: true
    path: /transmission
    annotations: {}
    tls:
      enabled: false
      secretName: ""

  config:
    auth:
      enabled: true
      username: "admin"
      password: "changeme1234"

  persistence:
    existingClaim: ""
    size: 1Gi
    storageClassName: ""
    accessModes:
      - ReadWriteOnce

# Default values for k8s-mediamanager.
# This is a YAML-formatted file.

# ──────────────────────────────────────────────────────────────────────────────
# Global settings shared by all services
# ──────────────────────────────────────────────────────────────────────────────
global:
  # UID/GID to run all service processes with
  puid: 1000
  pgid: 1000
  # Timezone for all services
  timezone: "Etc/UTC"
  # Default IP family policy for services ['SingleStack','PreferDualStack','RequireDualStack']
  ipFamilyPolicy: SingleStack
  # IP families for services — leave empty for auto, or set e.g. ['IPv4','IPv6']
  ipFamilies: []
  # Init container image used by all *arr services
  initImage:
    repository: docker.io/alpine
    tag: "3.24"
    pullPolicy: IfNotPresent

# ──────────────────────────────────────────────────────────────────────────────
# Service account
# ──────────────────────────────────────────────────────────────────────────────
serviceAccount:
  create: true
  automount: false
  annotations: {}
  # If not set and create is true, a name is generated using the fullname template
  name: ""

# ──────────────────────────────────────────────────────────────────────────────
# Shared media storage (NFS / ReadWriteMany PVC)
# ──────────────────────────────────────────────────────────────────────────────
sharedStorage:
  annotations:
    # Retain the PV on helm uninstall by default
    helm.sh/resource-policy: keep
  labels: {}
  accessModes:
    - ReadWriteMany
  size: 5Gi
  storageClassName: ""
  existingClaim: "media-pvc"
  selector: {}
  # Sub-paths within the shared volume for media libraries
  subPaths:
    tv: media/tv
    movies: media/movies
    music: media/music
    downloads: downloads

# ──────────────────────────────────────────────────────────────────────────────
# Gateway API configuration (replaces legacy Ingress)
# ──────────────────────────────────────────────────────────────────────────────
gateway:
  # Restricted gateway for internal services (arr apps, qBittorrent WebUI)
  restricted:
    enabled: false
    name: "restricted-home-gateway"
    namespace: "cni"
    hostname: "k8s-mediamanager.k8s.test"
  # Public gateway for externally-accessible services (Plex)
  public:
    enabled: false
    name: "public-gateway"
    namespace: "cni"
    hostname: "k8s-plex.k8s.test"

# ──────────────────────────────────────────────────────────────────────────────
# Plex Media Server
# ──────────────────────────────────────────────────────────────────────────────
plex:
  enabled: true
  # Plex claim token from https://plex.tv/claim
  claim: "CHANGEME"
  replicaCount: 1

  image:
    repository: ghcr.io/home-operations/plex
    tag: rolling
    pullPolicy: Always

  service:
    type: ClusterIP
    port: 32400
    nodePort:    # Only used when type=NodePort

  # startup/liveness are TCP on purpose: they assert process-alive only, so an
  # app-level misconfig (e.g. Secure connections = Required) can degrade the pod
  # to NotReady but can NEVER CrashLoop it. readiness asserts the real serving
  # path (plain HTTP /identity — the same hop the gateway uses).
  probes:
    readinessScheme: HTTP        # set HTTPS only if running secureConnections=Required
    startupFailureThreshold: 60  # 60 x 5s = 5 min for DB migrations on :rolling upgrades

  # Preferences pinned on every boot: the image entrypoint applies each entry as
  # PLEX_PREFERENCE_<n> (setPref on Preferences.xml) before PMS starts, overriding
  # whatever was saved via the web UI. secureConnections MUST stay "1" (Preferred)
  # in this deployment: TLS terminates at the Gateway; the gateway->pod hop and
  # kubelet probes are plain HTTP. Setting "Required" in the UI bricked the pod on
  # 2026-08-06. Mapping: 0=Required 1=Preferred 2=Disabled.
  preferences:
    secureConnections: "1"

  ingress:
    enabled: true
    annotations: {}
    tls:
      enabled: false
      secretName: ""

  persistence:
    existingClaim: ""
    size: 200Gi
    storageClassName: ""
    accessModes:
      - ReadWriteOnce
    annotations:
      helm.sh/resource-policy: keep

  resources:
    requests:
      cpu: "150m"
      memory: "2Gi"
    limits:
      cpu: "4"
      memory: "4Gi"

  nodeSelector: {}

  # Transcode scratch volume (emptyDir)
  # medium: "Memory" for tmpfs (counts against memory limit), "" for disk-backed
  transcode:
    enabled: true
    medium: ""
    sizeLimit: "14Gi"

  # Read-only /tv, /movies and /music: deleting media from the Plex UI then fails.
  mediaReadOnly: false

  extraVolumes: []
  extraVolumeMounts: []

# ──────────────────────────────────────────────────────────────────────────────
# Tautulli (Plex monitoring — disabled)
# Requires CHOWN, SETUID, SETGID, DAC_OVERRIDE caps; runAsNonRoot != true;
# incompatible with restricted Pod Security Standards.
# ──────────────────────────────────────────────────────────────────────────────
tautulli:
  enabled: false

  image:
    repository: ghcr.io/tautulli/tautulli
    tag: v2.17.2
    pullPolicy: Always

  service:
    type: ClusterIP
    port: 8181
    nodePort:

  ingress:
    enabled: true
    path: /tautulli
    annotations: {}
    tls:
      enabled: false
      secretName: ""

  persistence:
    existingClaim: ""
    size: 10Gi
    storageClassName: ""
    accessModes:
      - ReadWriteOnce
    annotations:
      helm.sh/resource-policy: keep

  resources:
    requests:
      cpu: "150m"
      memory: "96Mi"
    limits:
      cpu: "250m"
      memory: "512Mi"

  nodeSelector: {}
  extraVolumes: []
  extraVolumeMounts: []

# ──────────────────────────────────────────────────────────────────────────────
# Prowlarr (indexer manager)
# ──────────────────────────────────────────────────────────────────────────────
prowlarr:
  enabled: true
  apiKey: "CHANGEME-generate-a-random-32char-hex-key"
  instanceName: Prowlarr

  image:
    repository: ghcr.io/home-operations/prowlarr
    tag: rolling
    pullPolicy: Always

  service:
    type: ClusterIP
    port: 9696
    nodePort:

  ingress:
    enabled: true
    path: /prowlarr
    annotations: {}
    tls:
      enabled: false
      secretName: ""

  persistence:
    existingClaim: ""
    size: 10Gi
    storageClassName: ""
    accessModes:
      - ReadWriteOnce
    annotations:
      helm.sh/resource-policy: keep

  resources:
    requests:
      cpu: "50m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "1Gi"

  nodeSelector: {}
  extraEnv: []
  extraVolumes: []
  extraVolumeMounts: []
  # Above the .NET host shutdown timeout (up to 30 s), so the app exits before SIGKILL.
  terminationGracePeriodSeconds: 120

  # Byparr/FlareSolverr sidecar for CAPTCHA solving
  flaresolverr:
    enabled: true
    image:
      repository: ghcr.io/thephaseless/byparr
      tag: latest
      pullPolicy: Always
    port: 8191
    extraEnv: []
    resources: {}
    cache:
      # "" for disk-backed emptyDir, "Memory" for tmpfs (counts against pod memory limit)
      medium: ""
      sizeLimit: "512Mi"
    nodeSelector: {}

  metrics:
    enabled: true
    image:
      repository: ghcr.io/onedr0p/exportarr
      tag: v2.3.0
      pullPolicy: IfNotPresent
    serviceMonitor: true
    port: 9090
    flaresolverrMetricsPort: 9191
    backfill: true

# ──────────────────────────────────────────────────────────────────────────────
# Radarr (movies)
# ──────────────────────────────────────────────────────────────────────────────
radarr:
  enabled: true
  apiKey: "CHANGEME-generate-a-random-32char-hex-key"
  instanceName: Radarr

  image:
    repository: ghcr.io/home-operations/radarr
    tag: rolling
    pullPolicy: Always

  service:
    type: ClusterIP
    port: 7878
    nodePort:

  ingress:
    enabled: true
    path: /radarr
    annotations: {}
    tls:
      enabled: false
      secretName: ""

  persistence:
    existingClaim: ""
    size: 10Gi
    storageClassName: ""
    accessModes:
      - ReadWriteOnce
    annotations:
      helm.sh/resource-policy: keep

  resources:
    requests:
      cpu: "500m"
      memory: "512Mi"
    limits:
      cpu: "1"
      memory: "4Gi"

  nodeSelector: {}
  extraEnv: []
  extraVolumes: []
  extraVolumeMounts: []
  # Above the .NET host shutdown timeout (up to 30 s), so the app exits before SIGKILL.
  terminationGracePeriodSeconds: 120

  # Install ffprobe via init container (needed for DetectSample on Alpine-based images)
  ffprobe:
    enabled: false

  # sharedStorage sub-paths, one mount each; imports from one into another are never hardlinks.
  mediaSubPaths:
    - mountPath: /downloads
      subPath: downloads
    - mountPath: /movies
      subPath: media/movies
  # Whole sharedStorage volume at this path (e.g. /data); imports within it hardlink instead of copy. Empty: off.
  # WARNING: while mediaSubPaths also mounts these folders, an app-side file move deletes the files (README).
  dataMountPath: ""

  metrics:
    enabled: true
    image:
      repository: ghcr.io/onedr0p/exportarr
      tag: v2.3.0
      pullPolicy: IfNotPresent
    serviceMonitor: true
    port: 9090


{{- if include "k8s-mediamanager.cleanuparr.configEnabled" . }}
{{- /* The whole desired state, because it holds client and *arr credentials. */}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "k8s-mediamanager.fullname" . }}-cleanuparr-config
  labels:
    {{- include "k8s-mediamanager.labels" (dict "context" . "component" "cleanuparr") | nindent 4 }}
type: Opaque
data:
  desired-state.json: {{ include "k8s-mediamanager.cleanuparr.desiredState" . | b64enc }}
{{- end }}

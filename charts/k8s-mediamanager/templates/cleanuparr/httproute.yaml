{{- if and .Values.cleanuparr.enabled .Values.cleanuparr.ingress.enabled .Values.gateway.restricted.enabled }}
{{- include "k8s-mediamanager.httproute" (dict
  "context" .
  "component" "cleanuparr"
  "gatewayName" .Values.gateway.restricted.name
  "gatewayNamespace" .Values.gateway.restricted.namespace
  "hostname" .Values.gateway.restricted.hostname
  "path" .Values.cleanuparr.ingress.path
  "port" .Values.cleanuparr.service.port
) }}
{{- end }}

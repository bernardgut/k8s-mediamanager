{{- if .Values.cleanuparr.enabled }}
---
### CLEANUPARR — ingress from gateway, egress to the *arr and qbittorrent APIs (+ optional FQDNs)
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ include "k8s-mediamanager.fullname" . }}-cleanuparr
  labels:
    {{- include "k8s-mediamanager.labels" (dict "context" . "component" "cleanuparr") | nindent 4 }}
spec:
  endpointSelector:
    matchLabels:
      app: cleanuparr
  ingress:
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: {{ .Values.cleanuparr.service.port | quote }}
              protocol: TCP
  egress:
    {{- if .Values.sonarr.enabled }}
    - toEndpoints:
        - matchLabels:
            app: sonarr
      toPorts:
        - ports:
            - port: {{ .Values.sonarr.service.port | quote }}
              protocol: TCP
    {{- end }}
    {{- if .Values.radarr.enabled }}
    - toEndpoints:
        - matchLabels:
            app: radarr
      toPorts:
        - ports:
            - port: {{ .Values.radarr.service.port | quote }}
              protocol: TCP
    {{- end }}
    {{- if .Values.lidarr.enabled }}
    - toEndpoints:
        - matchLabels:
            app: lidarr
      toPorts:
        - ports:
            - port: {{ .Values.lidarr.service.port | quote }}
              protocol: TCP
    {{- end }}
    {{- if .Values.qbittorrent.enabled }}
    - toEndpoints:
        - matchLabels:
            app: qbittorrent
      toPorts:
        - ports:
            - port: {{ .Values.qbittorrent.service.webui.port | quote }}
              protocol: TCP
    {{- end }}
    {{- with .Values.cleanuparr.networkPolicy.egressFQDNs }}
    - toFQDNs:
        {{- toYaml . | nindent 8 }}
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    {{- end }}
{{- end }}
